<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171522">
<title>SLAP! — Pixel Face</title>
<style>
:root{color-scheme:dark;--ink:#f8f1e5;--muted:#b7b0c5;--pink:#ff6d91;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;background:radial-gradient(ellipse at 50% 22%,#393052 0,#201d30 43%,#12111b 100%);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px;overflow-x:hidden}
.game{width:min(100%,560px);text-align:center}.eyebrow{letter-spacing:.25em;font-size:.72rem;font-weight:900;color:var(--gold)}h1{font-size:clamp(2.6rem,12vw,4.8rem);line-height:.95;margin:8px 0 10px;font-weight:1000;letter-spacing:-.07em;text-shadow:4px 4px 0 #a73c6a} .sub{color:var(--muted);margin:0 0 18px;font-size:.96rem}
.hud{display:flex;gap:10px;justify-content:center;margin:0 auto 14px}.stat{background:#ffffff0c;border:1px solid #ffffff20;border-radius:14px;padding:9px 15px;min-width:112px}.stat small{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.stat strong{font-size:1.45rem;color:var(--gold);font-variant-numeric:tabular-nums}
.stage{position:relative;background:linear-gradient(#2b2940,#201d31);border:2px solid #ffffff24;border-radius:24px;padding:10px;box-shadow:0 16px 0 #0b0a12,0 26px 55px #0005;overflow:hidden;touch-action:manipulation;user-select:none}
.stage:before{content:"";position:absolute;inset:10px;border:1px dashed #ffffff16;border-radius:17px;pointer-events:none}
.face-wrap{position:relative;width:min(100%,380px);margin:auto;cursor:pointer;transform-origin:50% 65%;outline:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.face-wrap .face-image{width:100%;height:auto;display:block;image-rendering:pixelated;filter:drop-shadow(0 10px 0 #100e19)}.energy-can{position:absolute;z-index:30;top:-58px;left:50%;width:42px;height:auto;display:block;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(2px 3px 3px #000);animation:canDrop 2.4s ease-in forwards}@keyframes canDrop{0%{top:-58px;transform:translateX(-50%) rotate(-16deg)}45%{transform:translateX(-50%) rotate(13deg)}100%{top:72%;transform:translateX(-50%) rotate(0deg)}}.punch-effect{position:absolute;z-index:12;inset:0;overflow:visible;pointer-events:none;display:none}.punch-effect.play{display:block;animation:punchShake .52s steps(2,end)}.punch-effect.from-left .punch-fist:not(.left){display:none}.punch-effect:not(.from-left) .punch-fist.left{display:none}.punch-fist{position:absolute;right:-8%;top:34%;font-size:clamp(5rem,24vw,9rem);line-height:1;filter:drop-shadow(5px 7px 0 #17101b);transform:rotate(-28deg);animation:fistFly .52s cubic-bezier(.2,.8,.25,1) forwards}.punch-fist.left{right:auto;left:-8%;transform:scaleX(-1) rotate(-28deg);animation-name:fistFlyLeft}.punch-burst{position:absolute;left:48%;top:48%;width:42%;aspect-ratio:1;opacity:0;transform:translate(-50%,-50%) scale(.15);background:repeating-conic-gradient(from 8deg,#fff42b 0 8deg,#ff6b25 8deg 16deg,transparent 16deg 23deg);clip-path:polygon(50% 0,60% 30%,88% 8%,75% 39%,100% 50%,73% 60%,92% 90%,61% 74%,50% 100%,39% 73%,8% 91%,26% 60%,0 50%,27% 39%,9% 9%,40% 27%);animation:burstPop .52s ease-out forwards}.punch-burst:after{content:'POW!';position:absolute;inset:25% 0 0;color:#fff;font-size:clamp(1.2rem,7vw,2.6rem);font-weight:1000;font-style:italic;text-shadow:3px 3px #d52c35,-2px -2px #d52c35;transform:rotate(-12deg)}@keyframes fistFly{0%{right:-42%;top:42%;transform:rotate(-28deg) scale(.55)}55%{right:12%;top:34%;transform:rotate(-8deg) scale(1.18)}75%{right:8%;top:35%;transform:rotate(2deg) scale(1.08)}100%{right:-45%;top:42%;transform:rotate(18deg) scale(.7);opacity:0}}@keyframes fistFlyLeft{0%{left:-42%;top:42%;transform:scaleX(-1) rotate(-28deg) scale(.55)}55%{left:12%;top:34%;transform:scaleX(-1) rotate(-8deg) scale(1.18)}75%{left:8%;top:35%;transform:scaleX(-1) rotate(2deg) scale(1.08)}100%{left:-45%;top:42%;transform:scaleX(-1) rotate(18deg) scale(.7);opacity:0}}@keyframes burstPop{0%,35%{opacity:0;transform:translate(-50%,-50%) scale(.15)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}}@keyframes punchShake{0%,100%{transform:translateX(0)}35%{transform:translateX(-7px)}65%{transform:translateX(6px)}}.damage-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.face-wrap.hit{animation:hit .22s steps(2,end)}@keyframes hit{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-10px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}75%{transform:translateX(-4px) rotate(-1deg)}100%{transform:none}}
.damage{opacity:0;transition:opacity .25s;pointer-events:none}.damage.show{opacity:1}.bruise{fill:#75405f;fill-opacity:.78;stroke:#48283f;stroke-width:2}.bruise-light{fill:#a35a75;fill-opacity:.72}.black-eye{fill:#39243f;fill-opacity:.88;stroke:#251a2b;stroke-width:3}.cut{fill:none;stroke:#6f1b2c;stroke-width:5;stroke-linecap:square;stroke-linejoin:miter}.cut-light{fill:none;stroke:#ef6a69;stroke-width:2;stroke-linecap:square}.blood{fill:#b51f37}.blood-dark{fill:#781629}.spark{position:absolute;z-index:5;font-size:2rem;pointer-events:none;animation:pop .55s ease-out forwards;text-shadow:2px 2px #111}@keyframes pop{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),-60px) scale(1.35);opacity:0}}
.slaphint{font-size:.8rem;color:#d7cfe4;padding:8px 0 2px;font-weight:750;letter-spacing:.04em}.message{height:28px;margin:10px 0 4px;font-weight:900;color:var(--pink);font-size:1rem}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}button{-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;user-select:none;min-height:50px;font:inherit;font-weight:900;border:0;border-radius:13px;padding:13px 20px;cursor:pointer;touch-action:manipulation}#slapBtn{background:linear-gradient(180deg,#ff7ca0,#e84574);color:#fff;box-shadow:0 5px 0 #982647;flex:1;min-width:180px;font-size:1.08rem}#slapBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #982647}.meter{height:8px;border-radius:20px;background:#ffffff15;margin:12px 4px 0;overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff6d91,#b42d55);transition:width .25s}.foot{font-size:.75rem;color:#928aa5;margin-top:15px}
@media(max-width:600px){body{padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}.stage{box-shadow:0 8px 0 #0b0a12,0 14px 28px #0004}.face-wrap .face-image{filter:none}.punch-fist{filter:drop-shadow(2px 3px 0 #17101b)}.spark{text-shadow:1px 1px #111}}@media(max-height:740px) and (max-width:600px){body{align-items:flex-start;padding-top:max(8px,env(safe-area-inset-top))}.hud{margin-bottom:8px}.stage{padding:6px}.face-wrap{width:min(100%,min(340px,52vh))}.message{margin:6px 0 2px}.controls{margin-top:8px}h1{font-size:2.5rem;margin:4px 0 6px}}@media(max-width:400px){body{padding-left:10px;padding-right:10px}.stage{padding:4px}.face-wrap{width:min(100%,340px)}.stat{min-width:95px;padding:8px 10px}}@media(prefers-reduced-motion:reduce){.punch-effect.play,.punch-fist,.punch-burst,.face-wrap.hit,.energy-can,.spark{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="game">

 <div class="hud"><div class="stat"><small>Slaps</small><strong id="score">0</strong></div><div class="stat"><small>Damage level</small><strong id="level">Fresh</strong></div></div>
 <div class="stage" id="stage">
  <div class="face-wrap" id="face" role="button" tabindex="0" aria-label="Slap the pixel face">
   <img class="face-image" id="faceImage" src="/slap/slap-stage-01.png?v=28" alt="Face — damage stage 1 of 18" draggable="false">
   <div class="punch-effect" id="punchEffect" aria-hidden="true"><span class="punch-fist">👊</span><span class="punch-fist left">👊</span><span class="punch-burst"></span></div>
  </div>
  <div class="meter"><span id="meterFill"></span></div>
 </div>
 <div class="message" id="message" aria-live="polite">Ah, would ya stop!</div>
 <div class="controls"><button id="slapBtn">✋ SLAP!</button><button id="soundBtn" aria-pressed="true">🔊 Sound on</button></div>
</main>
<script>
(()=> {
 const face=document.getElementById('face');
 const faceImage=document.getElementById('faceImage');
 const scoreEl=document.getElementById('score');
 const levelEl=document.getElementById('level');
 const fill=document.getElementById('meterFill');
 const message=document.getElementById('message');
 const stage=document.getElementById('stage');
 const soundBtn=document.getElementById('soundBtn');
 const punchEffect=document.getElementById('punchEffect');
 let slaps=0, soundOn=true, finalVoicePlayed=false;
 const levels=['Fresh','A little sore','First bruise','Bruised','Black eye','Battered','More bruises','Cut and bruised','Looking rough','Very battered','Swollen','Bloodied','Miserable','Really sorry','Tearful','Crying','Almost had enough','Maximum damage'];
 const lines=['Ah, would ya stop!','Jaysus, that was a belter!','You felt that, didn’t ya?','You’re some dose!','Cop on to yourself!','Go on outta that!','Scarlet for ya!','That looks fierce sore!','You’re having a laugh!','Will ya stop acting the maggot!','Ah, leave it out!','You’re not right in the head!','What are ya like?!','Fair play, you’re still standing!','Don’t be giving me that!','You’re absolutely banjaxed!','Nearly there, ya eejit!','Ah, would ya look at the state of ya!'];
 let canTimer=null;
 function scheduleCan(){
   clearTimeout(canTimer);
   canTimer=setTimeout(dropEnergyCan,6000+Math.random()*4000);
 }
 function dropEnergyCan(){
   if(document.querySelector('.energy-can'))return scheduleCan();
   const can=document.createElement('img');
   can.className='energy-can';
   can.src='/slap/monster-can-isolated.png?v=41';
   can.alt='Monster energy boost';
   can.draggable=false;
   let collected=false;
   const collectCan=()=>{
     if(collected)return;
     collected=true;
     can.remove();
     slaps=0;finalVoicePlayed=false;
     scoreEl.textContent='0';
     message.textContent='ENERGY RESTORED! Fresh face!';
     renderFace();
     scheduleCan();
   };
   can.addEventListener('animationend',collectCan,{once:true});
   face.appendChild(can);
   setTimeout(collectCan,2900);
 }
 const frameCache=[];
 for(let i=1;i<=18;i++){const preload=new Image();preload.src='/slap/slap-stage-'+String(i).padStart(2,'0')+'.png?v=43';if(preload.decode)preload.decode().catch(()=>{});frameCache.push(preload);}
 function renderFace(){
   const frame=Math.min(18,Math.floor(slaps/5)+1);
   faceImage.src='/slap/slap-stage-'+String(frame).padStart(2,'0')+'.png?v=43';
   faceImage.alt='Face — damage stage '+frame+' of 18';
   levelEl.textContent=levels[frame-1];
   fill.style.width=((frame-1)/17*100)+'%';
 }
 const slapSounds=['/slap/slap%201.mp3','/slap/slap%202.mp3','/slap/slap%203.mp3'].map(src=>{const audio=new Audio(src);audio.preload='auto';audio.load();return audio;});
 let lastSound=-1,audioPrimed=false;
 function primeAudio(){if(audioPrimed)return;audioPrimed=true;slapSounds.forEach(a=>{try{a.load();}catch(e){}});}
 function playSlapSound(){
   if(!soundOn)return;
   let pick=Math.floor(Math.random()*slapSounds.length);
   if(slapSounds.length>1&&pick===lastSound)pick=(pick+1+Math.floor(Math.random()*(slapSounds.length-1)))%slapSounds.length;
   lastSound=pick;
   const audio=slapSounds[pick];
   slapSounds.forEach(a=>{if(a!==audio){a.pause();a.currentTime=0;}});
   audio.pause();audio.currentTime=0;
   const result=audio.play();
   if(result&&typeof result.catch==='function')result.catch(()=>{});
 }
 function slap(){
   primeAudio();
   slaps++;
   punchEffect.classList.toggle('from-left',Math.random()<0.5);
   punchEffect.classList.remove('play');void punchEffect.offsetWidth;punchEffect.classList.add('play');
   setTimeout(()=>punchEffect.classList.remove('play'),560);
   face.classList.remove('hit');void face.offsetWidth;face.classList.add('hit');
   setTimeout(()=>face.classList.remove('hit'),240);
   scoreEl.textContent=slaps;
   renderFace();
   message.textContent=lines[Math.min(17,Math.floor(slaps/5))];
   if(slaps>=85&&!finalVoicePlayed){
     finalVoicePlayed=true;
     if('speechSynthesis' in window&&'SpeechSynthesisUtterance' in window){
       window.speechSynthesis.cancel();
       const chooseMaleVoice=()=>{
         const voices=window.speechSynthesis.getVoices();
         const maleVoice=voices.find(v=>/david|daniel|ryan|guy|mark|james|thomas|george|alex|oliver|liam/i.test(v.name)&&!/female/i.test(v.name))
           ||voices.find(v=>/male/i.test(v.name)&&!/female/i.test(v.name));
         const voiceLine=new SpeechSynthesisUtterance('ok, I will do a bit of work');
         voiceLine.lang='en-IE';voiceLine.rate=0.9;voiceLine.pitch=0.68;
         if(maleVoice)voiceLine.voice=maleVoice;
         window.speechSynthesis.speak(voiceLine);
       };
       if(window.speechSynthesis.getVoices().length)chooseMaleVoice();
       else window.speechSynthesis.addEventListener('voiceschanged',chooseMaleVoice,{once:true});
     }
   }
   playSlapSound();
   const s=document.createElement('span');s.className='spark';
   s.textContent=['💥','✋','POW!','SMACK!'][Math.floor(Math.random()*4)];
   s.style.left=(28+Math.random()*44)+'%';s.style.top=(20+Math.random()*35)+'%';
   s.style.setProperty('--dx',(Math.random()*100-50)+'px');
   stage.appendChild(s);setTimeout(()=>s.remove(),600);
 }
 face.addEventListener('click',slap);
 face.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();slap();}});
 document.getElementById('slapBtn').addEventListener('click',slap);
 soundBtn.addEventListener('click',()=>{
   soundOn=!soundOn;
   if(soundOn)primeAudio();soundBtn.textContent=soundOn?'🔊 Sound on':'🔇 Sound off';
   soundBtn.setAttribute('aria-pressed',String(soundOn));
   if(!soundOn)slapSounds.forEach(a=>{a.pause();a.currentTime=0;});
 });
 faceImage.addEventListener('error',()=>{message.textContent='Could not load storyboard frame '+Math.min(18,slaps+1)+'. Check the image files.';});
 renderFace();
 scheduleCan();
})();</script>
</body></html>
