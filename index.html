<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171522">
<title>SLAP! — Pixel Face</title>
<style>
:root{color-scheme:dark;--ink:#f8f1e5;--muted:#b7b0c5;--pink:#ff6d91;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 22%,#393052 0,#201d30 43%,#12111b 100%);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px;overflow-x:hidden}
.game{width:min(100%,560px);text-align:center}.eyebrow{letter-spacing:.25em;font-size:.72rem;font-weight:900;color:var(--gold)}h1{font-size:clamp(2.6rem,12vw,4.8rem);line-height:.95;margin:8px 0 10px;font-weight:1000;letter-spacing:-.07em;text-shadow:4px 4px 0 #a73c6a} .sub{color:var(--muted);margin:0 0 18px;font-size:.96rem}
.hud{display:flex;gap:10px;justify-content:center;margin:0 auto 14px}.stat{background:#ffffff0c;border:1px solid #ffffff20;border-radius:14px;padding:9px 15px;min-width:112px}.stat small{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.stat strong{font-size:1.45rem;color:var(--gold);font-variant-numeric:tabular-nums}
.stage{position:relative;background:linear-gradient(#2b2940,#201d31);border:2px solid #ffffff24;border-radius:24px;padding:10px;box-shadow:0 16px 0 #0b0a12,0 26px 55px #0005;overflow:hidden;touch-action:manipulation;user-select:none}
.stage:before{content:"";position:absolute;inset:10px;border:1px dashed #ffffff16;border-radius:17px;pointer-events:none}
.face-wrap{position:relative;width:min(100%,380px);margin:auto;cursor:pointer;transform-origin:50% 65%;transition:transform .09s;outline:none}.face-wrap img{width:100%;height:auto;display:block;image-rendering:pixelated;filter:drop-shadow(0 10px 0 #100e19)}.face-wrap.hit{animation:hit .22s steps(2,end)}@keyframes hit{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-10px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}75%{transform:translateX(-4px) rotate(-1deg)}100%{transform:none}}
.damage{opacity:0;transition:opacity .25s;pointer-events:none}.damage.show{opacity:1}.bruise{fill:#75405f;fill-opacity:.78;stroke:#48283f;stroke-width:2}.bruise-light{fill:#a35a75;fill-opacity:.72}.black-eye{fill:#39243f;fill-opacity:.88;stroke:#251a2b;stroke-width:3}.cut{fill:none;stroke:#6f1b2c;stroke-width:5;stroke-linecap:square;stroke-linejoin:miter}.cut-light{fill:none;stroke:#ef6a69;stroke-width:2;stroke-linecap:square}.blood{fill:#b51f37}.blood-dark{fill:#781629}.spark{position:absolute;z-index:5;font-size:2rem;pointer-events:none;animation:pop .55s ease-out forwards;text-shadow:2px 2px #111}@keyframes pop{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),-60px) scale(1.35);opacity:0}}
.slaphint{font-size:.8rem;color:#d7cfe4;padding:8px 0 2px;font-weight:750;letter-spacing:.04em}.message{height:28px;margin:10px 0 4px;font-weight:900;color:var(--pink);font-size:1rem}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}button{font:inherit;font-weight:900;border:0;border-radius:13px;padding:13px 20px;cursor:pointer;touch-action:manipulation}#slapBtn{background:linear-gradient(180deg,#ff7ca0,#e84574);color:#fff;box-shadow:0 5px 0 #982647;flex:1;min-width:180px;font-size:1.08rem}#slapBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #982647}#resetBtn{background:#ffffff13;color:var(--ink);border:1px solid #ffffff2b}.meter{height:8px;border-radius:20px;background:#ffffff15;margin:12px 4px 0;overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff6d91,#b42d55);transition:width .25s}.foot{font-size:.75rem;color:#928aa5;margin-top:15px}
@media(max-width:400px){body{padding:12px}.stage{padding:4px}.face-wrap{width:min(100%,340px)}.stat{min-width:95px;padding:8px 10px}}
</style>
</head>
<body>
<main class="game">
 <div class="eyebrow">A VERY SILLY PIXEL GAME</div><h1>SLAP!</h1><p class="sub">Give the pixel lad a tap. Watch the damage build!</p>
 <div class="hud"><div class="stat"><small>Slaps</small><strong id="score">0</strong></div><div class="stat"><small>Damage level</small><strong id="level">Fresh</strong></div></div>
 <div class="stage" id="stage">
  <div class="face-wrap" id="face" role="button" tabindex="0" aria-label="Slap the pixel face">
   <img src="slap-face.png" alt="The exact 16-bit pixel-art face" draggable="false">
   <svg class="damage-overlay" viewBox="0 0 260 320" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;filter:none;pointer-events:none">
    <g id="damage1" class="damage">
      <path class="bruise" d="M69 143l8-8 19-2 16 7 8 11-5 13-14 8-19-3-11-10z"/>
      <path class="bruise-light" d="M75 145l12-6 17 3 9 8-7 9-17 2-12-6z"/>
      <ellipse class="bruise" cx="193" cy="164" rx="18" ry="11"/>
      <path class="cut" d="M103 116l-7 10 4 7-9 10"/><path class="cut-light" d="M103 116l-7 10"/>
    </g>
    <g id="damage2" class="damage">
      <path class="black-eye" d="M70 128l13-9 24 1 17 8 5 12-8 15-19 7-22-5-12-12z"/>
      <path class="bruise-light" d="M77 134l14-6 20 3 11 8-8 8-17 4-14-5z"/>
      <path class="cut" d="M168 112l11 8 8 10 10 7 9 14"/><path class="cut-light" d="M168 112l11 8 8 10"/>
      <path class="cut" d="M205 177l-10 12 7 9-11 12"/><path class="cut-light" d="M205 177l-10 12"/>
      <path class="cut" d="M94 154l-5 10 5 7"/><circle class="blood" cx="195" cy="213" r="3"/><circle class="blood-dark" cx="91" cy="173" r="3"/>
    </g>
    <g id="damage3" class="damage">
      <path class="bruise" d="M169 165l13-9 17 4 11 10-4 13-17 8-16-7z"/><path class="bruise-light" d="M174 167l13-5 13 6-4 8-13 4z"/>
      <path class="cut" d="M169 163l10 9-7 10 12 9 5 11"/><path class="cut-light" d="M169 163l10 9-7 10"/>
      <path class="cut" d="M126 173l-6 10 5 8-8 11"/><path class="cut-light" d="M126 173l-6 10"/>
      <path class="blood-dark" d="M183 195h5v9h-4v9h-4v-12h3z M92 176h4v8h-3v7h-4v-10h3z"/>
    </g>
    <g id="damage4" class="damage">
      <path class="bruise" d="M49 184l11-7 13 4 8 10-3 15-11 9-13-5-7-12z"/>
      <path class="black-eye" d="M64 130l12-12 27-3 23 10 9 15-7 18-18 10-25-5-17-13z"/>
      <path class="bruise-light" d="M73 132l16-7 20 4 14 8-8 10-18 6-15-5z"/>
      <path class="cut" d="M80 105l-9 13 5 8-9 12 4 8"/><path class="cut-light" d="M80 105l-9 13 5 8"/>
      <path class="cut" d="M155 139l-7 11 8 9-5 11 7 8"/><path class="cut-light" d="M155 139l-7 11 8 9"/>
      <path class="cut" d="M180 210l-8 9 5 8-9 12"/><path class="cut-light" d="M180 210l-8 9"/>
      <path class="blood-dark" d="M72 151h5v12h-4v10h-4v-13h3z M151 176h5v10h-4v12h-4v-14h3z M181 235h5v12h-4v14h-4v-18h3z"/>
      <path class="blood" d="M70 153h3v8h-3z M151 178h3v7h-3z M181 238h3v8h-3z"/>
      <circle class="blood" cx="62" cy="171" r="3"/><circle class="blood" cx="204" cy="193" r="3"/><circle class="blood-dark" cx="145" cy="190" r="3"/>
    </g>
   </svg>
  </div>
  <div class="slaphint">TAP THE FACE OR HIT THE SLAP BUTTON</div>
  <div class="meter"><span id="meterFill"></span></div>
 </div>
 <div class="message" id="message" aria-live="polite">He's feeling pretty confident...</div>
 <div class="controls"><button id="slapBtn">✋ SLAP!</button><button id="resetBtn">↻ Reset</button></div>
 <div class="foot">Just cartoon slapstick — no real people were harmed in the making of this game.</div>
</main>
<script>
(()=>{const face=document.getElementById('face'),scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),fill=document.getElementById('meterFill'),message=document.getElementById('message'),stage=document.getElementById('stage');let slaps=0;const lines=['A cheeky little tap!','Oof! That left a mark.','The pixel bruises are showing.','That one left a scratch!','He might need a pixel ice pack.','Full-on 16-bit slapstick!','Somebody find this lad a cushion.'];const levels=['Fresh','Rosy','Bruised','Battered','Rough','Legendary'];function slap(){slaps++;face.classList.remove('hit');void face.offsetWidth;face.classList.add('hit');setTimeout(()=>face.classList.remove('hit'),240);scoreEl.textContent=slaps;const n=Math.min(4,Math.floor((slaps-1)/3)+1);for(let i=1;i<=4;i++)document.getElementById('damage'+i).classList.toggle('show',slaps>=i*3);levelEl.textContent=slaps===0?'Fresh':levels[Math.min(levels.length-1,Math.floor(slaps/2))];fill.style.width=Math.min(100,slaps/12*100)+'%';message.textContent=slaps%3===0?lines[Math.min(lines.length-1,Math.floor(slaps/3))]:['Well, that was rude.','Another pixel-perfect slap!','The face is not impressed.'][slaps%3];const s=document.createElement('span');s.className='spark';s.textContent=['💥','✋','POW!','SMACK!'][Math.floor(Math.random()*4)];s.style.left=(28+Math.random()*44)+'%';s.style.top=(20+Math.random()*35)+'%';s.style.setProperty('--dx',(Math.random()*100-50)+'px');stage.appendChild(s);setTimeout(()=>s.remove(),600);if(n===4&&slaps%3===0)message.textContent='Maximum cartoon damage! Reset for another round.'}function reset(){slaps=0;scoreEl.textContent='0';levelEl.textContent='Fresh';fill.style.width='0%';for(let i=1;i<=4;i++)document.getElementById('damage'+i).classList.remove('show');message.textContent="He's feeling pretty confident...";stage.querySelectorAll('.spark').forEach(x=>x.remove())}face.addEventListener('click',slap);face.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();slap()}});document.getElementById('slapBtn').addEventListener('click',slap);document.getElementById('resetBtn').addEventListener('click',reset)})();
</script>
</body></html>
