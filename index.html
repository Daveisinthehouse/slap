<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171522">
<title>SLAP! — Pixel Face</title>
<style>
:root{color-scheme:dark;--ink:#f8f1e5;--muted:#b7b0c5;--pink:#ff6d91;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 22%,#393052 0,#201d30 43%,#12111b 100%);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px;overflow-x:hidden}
.game{width:min(100%,560px);text-align:center}.eyebrow{letter-spacing:.25em;font-size:.72rem;font-weight:900;color:var(--gold)}h1{font-size:clamp(2.6rem,12vw,4.8rem);line-height:.95;margin:8px 0 10px;font-weight:1000;letter-spacing:-.07em;text-shadow:4px 4px 0 #a73c6a} .sub{color:var(--muted);margin:0 0 18px;font-size:.96rem}
.hud{display:flex;gap:10px;justify-content:center;margin:0 auto 14px}.stat{background:#ffffff0c;border:1px solid #ffffff20;border-radius:14px;padding:9px 15px;min-width:112px}.stat small{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.stat strong{font-size:1.45rem;color:var(--gold);font-variant-numeric:tabular-nums}
.stage{position:relative;background:linear-gradient(#2b2940,#201d31);border:2px solid #ffffff24;border-radius:24px;padding:10px;box-shadow:0 16px 0 #0b0a12,0 26px 55px #0005;overflow:hidden;touch-action:manipulation;user-select:none}
.stage:before{content:"";position:absolute;inset:10px;border:1px dashed #ffffff16;border-radius:17px;pointer-events:none}
.face-wrap{position:relative;width:min(100%,380px);margin:auto;cursor:pointer;transform-origin:50% 65%;transition:transform .09s;outline:none}.face-wrap .face-image{width:100%;height:auto;display:block;image-rendering:pixelated;filter:drop-shadow(0 10px 0 #100e19)}.damage-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.face-wrap.hit{animation:hit .22s steps(2,end)}@keyframes hit{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-10px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}75%{transform:translateX(-4px) rotate(-1deg)}100%{transform:none}}
.damage{opacity:0;transition:opacity .25s;pointer-events:none}.damage.show{opacity:1}.bruise{fill:#75405f;fill-opacity:.78;stroke:#48283f;stroke-width:2}.bruise-light{fill:#a35a75;fill-opacity:.72}.black-eye{fill:#39243f;fill-opacity:.88;stroke:#251a2b;stroke-width:3}.cut{fill:none;stroke:#6f1b2c;stroke-width:5;stroke-linecap:square;stroke-linejoin:miter}.cut-light{fill:none;stroke:#ef6a69;stroke-width:2;stroke-linecap:square}.blood{fill:#b51f37}.blood-dark{fill:#781629}.spark{position:absolute;z-index:5;font-size:2rem;pointer-events:none;animation:pop .55s ease-out forwards;text-shadow:2px 2px #111}@keyframes pop{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),-60px) scale(1.35);opacity:0}}
.slaphint{font-size:.8rem;color:#d7cfe4;padding:8px 0 2px;font-weight:750;letter-spacing:.04em}.message{height:28px;margin:10px 0 4px;font-weight:900;color:var(--pink);font-size:1rem}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}button{font:inherit;font-weight:900;border:0;border-radius:13px;padding:13px 20px;cursor:pointer;touch-action:manipulation}#slapBtn{background:linear-gradient(180deg,#ff7ca0,#e84574);color:#fff;box-shadow:0 5px 0 #982647;flex:1;min-width:180px;font-size:1.08rem}#slapBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #982647}#resetBtn{background:#ffffff13;color:var(--ink);border:1px solid #ffffff2b}.meter{height:8px;border-radius:20px;background:#ffffff15;margin:12px 4px 0;overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff6d91,#b42d55);transition:width .25s}.foot{font-size:.75rem;color:#928aa5;margin-top:15px}
@media(max-width:400px){body{padding:12px}.stage{padding:4px}.face-wrap{width:min(100%,340px)}.stat{min-width:95px;padding:8px 10px}}
</style>
</head>
<body>
<main class="game">

 <div class="hud"><div class="stat"><small>Slaps</small><strong id="score">0</strong></div><div class="stat"><small>Damage level</small><strong id="level">Fresh</strong></div></div>
 <div class="stage" id="stage">
  <div class="face-wrap" id="face" role="button" tabindex="0" aria-label="Slap the pixel face">
   <img class="face-image" src="/slap/slap-face%20(1).png?v=17" alt="Clean 16-bit face" draggable="false">
   <img class="damaged-image" id="damageImage" src="/slap/slap-damaged-matched.png?v=17" alt="" draggable="false">
  </div>
  <div class="slaphint">TAP THE FACE OR HIT THE SLAP BUTTON</div>
  <div class="meter"><span id="meterFill"></span></div>
 </div>
 <div class="message" id="message" aria-live="polite">He's feeling pretty confident...</div>
 <div class="controls"><button id="slapBtn">✋ SLAP!</button><button id="resetBtn">↻ Reset</button><button id="soundBtn" aria-pressed="true">🔊 Sound on</button></div>
 <div class="foot">Just cartoon slapstick — no real people were harmed in the making of this game.</div>
</main>
<script>
(()=> {
 const face=document.getElementById('face');
 const scoreEl=document.getElementById('score');
 const levelEl=document.getElementById('level');
 const fill=document.getElementById('meterFill');
 const message=document.getElementById('message');
 const stage=document.getElementById('stage');
 let slaps=0;
 const levels=['Fresh','Rosy','Bruised','Battered','Rough','Legendary'];
 const lines=['Oof! That one stung.','That cheek is turning purple.','A little cut, a lot of regret.','Both sides are feeling it now.','He might need an ice pack.','Maximum cartoon damage!'];
 const damageGroups=[
  document.getElementById('bruiseOne'),
  document.getElementById('bruiseTwo'),
  document.getElementById('cutsOne'),
  document.getElementById('cutsTwo')
 ];
 function renderDamage(){
   damageGroups.forEach((g,i)=>g.setAttribute('opacity',slaps>=i+1?'1':'0'));
 }
 function playImpact(){
   try {
     const AC=window.AudioContext||window.webkitAudioContext;
     if(!AC)return;
     const ac=new AC(), now=ac.currentTime;
     const n=Math.floor(ac.sampleRate*.11), buf=ac.createBuffer(1,n,ac.sampleRate), data=buf.getChannelData(0);
     for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);
     const src=ac.createBufferSource();src.buffer=buf;
     const filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1350;
     const gain=ac.createGain();gain.gain.setValueAtTime(.42,now);gain.gain.exponentialRampToValueAtTime(.001,now+.11);
     src.connect(filter);filter.connect(gain);gain.connect(ac.destination);src.start();src.stop(now+.11);
     setTimeout(()=>ac.close(),250);
   }catch(e){}
 }
 function reactVoice(){
   if(!('speechSynthesis' in window))return;
   try{
     window.speechSynthesis.cancel();
     const utter=new SpeechSynthesisUtterance(slaps%2?'Ow!':'Off!');
     utter.rate=1.1;utter.pitch=slaps%2?1.05:.85;utter.volume=.8;
     window.speechSynthesis.speak(utter);
   }catch(e){}
 }
 function slap(){
   slaps++;
   face.classList.remove('hit');void face.offsetWidth;face.classList.add('hit');
   setTimeout(()=>face.classList.remove('hit'),240);
   scoreEl.textContent=slaps;
   levelEl.textContent=levels[Math.min(levels.length-1,Math.floor(slaps/2))];
   fill.style.width=Math.min(100,slaps/8*100)+'%';
   message.textContent=lines[Math.min(lines.length-1,slaps-1)];
   renderDamage();playImpact();reactVoice();
   const s=document.createElement('span');s.className='spark';s.textContent=['💥','✋','POW!','SMACK!'][Math.floor(Math.random()*4)];
   s.style.left=(28+Math.random()*44)+'%';s.style.top=(20+Math.random()*35)+'%';s.style.setProperty('--dx',(Math.random()*100-50)+'px');stage.appendChild(s);setTimeout(()=>s.remove(),600);
 }
 function reset(){
   slaps=0;scoreEl.textContent='0';levelEl.textContent='Fresh';fill.style.width='0%';message.textContent="He's feeling pretty confident...";
   stage.querySelectorAll('.spark').forEach(x=>x.remove());renderDamage();
   if('speechSynthesis' in window)window.speechSynthesis.cancel();
 }
 face.addEventListener('click',slap);
 face.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();slap();}});
 document.getElementById('slapBtn').addEventListener('click',slap);
 document.getElementById('resetBtn').addEventListener('click',reset);
 renderDamage();
})();</script>
</body></html>
