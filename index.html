<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171522">
<title>SLAP! — Pixel Face</title>
<style>
:root{color-scheme:dark;--ink:#f8f1e5;--muted:#b7b0c5;--pink:#ff6d91;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 22%,#393052 0,#201d30 43%,#12111b 100%);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px;overflow-x:hidden}
.game{width:min(100%,560px);text-align:center}.eyebrow{letter-spacing:.25em;font-size:.72rem;font-weight:900;color:var(--gold)}h1{font-size:clamp(2.6rem,12vw,4.8rem);line-height:.95;margin:8px 0 10px;font-weight:1000;letter-spacing:-.07em;text-shadow:4px 4px 0 #a73c6a} .sub{color:var(--muted);margin:0 0 18px;font-size:.96rem}
.hud{display:flex;gap:10px;justify-content:center;margin:0 auto 14px}.stat{background:#ffffff0c;border:1px solid #ffffff20;border-radius:14px;padding:9px 15px;min-width:112px}.stat small{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.stat strong{font-size:1.45rem;color:var(--gold);font-variant-numeric:tabular-nums}
.stage{position:relative;background:linear-gradient(#2b2940,#201d31);border:2px solid #ffffff24;border-radius:24px;padding:10px;box-shadow:0 16px 0 #0b0a12,0 26px 55px #0005;overflow:hidden;touch-action:manipulation;user-select:none}
.stage:before{content:"";position:absolute;inset:10px;border:1px dashed #ffffff16;border-radius:17px;pointer-events:none}
.face-wrap{position:relative;width:min(100%,380px);margin:auto;cursor:pointer;transform-origin:50% 65%;transition:transform .09s;outline:none}.face-wrap canvas{width:100%;height:auto;display:block;image-rendering:pixelated;filter:drop-shadow(0 10px 0 #100e19)}.face-wrap.hit{animation:hit .22s steps(2,end)}@keyframes hit{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-10px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}75%{transform:translateX(-4px) rotate(-1deg)}100%{transform:none}}
.damage{opacity:0;transition:opacity .25s;pointer-events:none}.damage.show{opacity:1}.bruise{fill:#75405f;fill-opacity:.78;stroke:#48283f;stroke-width:2}.bruise-light{fill:#a35a75;fill-opacity:.72}.black-eye{fill:#39243f;fill-opacity:.88;stroke:#251a2b;stroke-width:3}.cut{fill:none;stroke:#6f1b2c;stroke-width:5;stroke-linecap:square;stroke-linejoin:miter}.cut-light{fill:none;stroke:#ef6a69;stroke-width:2;stroke-linecap:square}.blood{fill:#b51f37}.blood-dark{fill:#781629}.spark{position:absolute;z-index:5;font-size:2rem;pointer-events:none;animation:pop .55s ease-out forwards;text-shadow:2px 2px #111}@keyframes pop{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),-60px) scale(1.35);opacity:0}}
.slaphint{font-size:.8rem;color:#d7cfe4;padding:8px 0 2px;font-weight:750;letter-spacing:.04em}.message{height:28px;margin:10px 0 4px;font-weight:900;color:var(--pink);font-size:1rem}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}button{font:inherit;font-weight:900;border:0;border-radius:13px;padding:13px 20px;cursor:pointer;touch-action:manipulation}#slapBtn{background:linear-gradient(180deg,#ff7ca0,#e84574);color:#fff;box-shadow:0 5px 0 #982647;flex:1;min-width:180px;font-size:1.08rem}#slapBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #982647}#resetBtn{background:#ffffff13;color:var(--ink);border:1px solid #ffffff2b}.meter{height:8px;border-radius:20px;background:#ffffff15;margin:12px 4px 0;overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff6d91,#b42d55);transition:width .25s}.foot{font-size:.75rem;color:#928aa5;margin-top:15px}
@media(max-width:400px){body{padding:12px}.stage{padding:4px}.face-wrap{width:min(100%,340px)}.stat{min-width:95px;padding:8px 10px}}
</style>
</head>
<body>
<main class="game">
 <div class="eyebrow">A VERY SILLY PIXEL GAME</div><h1>SLAP!</h1><p class="sub">Give the pixel lad a tap. Watch the damage build!</p>
 <div class="hud"><div class="stat"><small>Slaps</small><strong id="score">0</strong></div><div class="stat"><small>Damage level</small><strong id="level">Fresh</strong></div></div>
 <div class="stage" id="stage">
  <div class="face-wrap" id="face" role="button" tabindex="0" aria-label="Slap the pixel face">
   <canvas id="faceCanvas" width="260" height="320" aria-label="Pixel-art face that becomes bruised and cut as you slap"></canvas>
  </div>
  <div class="slaphint">TAP THE FACE OR HIT THE SLAP BUTTON</div>
  <div class="meter"><span id="meterFill"></span></div>
 </div>
 <div class="message" id="message" aria-live="polite">He's feeling pretty confident...</div>
 <div class="controls"><button id="slapBtn">✋ SLAP!</button><button id="resetBtn">↻ Reset</button></div>
 <div class="foot">Just cartoon slapstick — no real people were harmed in the making of this game.</div>
</main>
<script>
(()=> {
 const face=document.getElementById('face'), canvas=document.getElementById('faceCanvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
 const scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),fill=document.getElementById('meterFill'),message=document.getElementById('message'),stage=document.getElementById('stage');
 let slaps=0, ready=0, damageLayers=[];
 const clean=new Image(), damaged=new Image();
 clean.src='slap-face.png'; damaged.src='slap-damaged.png';
 clean.onload=initClean; damaged.onload=initDamaged;
 clean.onerror=()=>{message.textContent='Could not load the original face image.';};
 damaged.onerror=()=>{message.textContent='Damage reference unavailable; loading original face.';};
 function initClean(){if(!clean.complete||!clean.naturalWidth)return;ready=1;renderFace();}
 function initDamaged(){if(!damaged.complete||!damaged.naturalWidth)return;if(clean.complete&&clean.naturalWidth){ready=1;buildDamageLayers();renderFace();}}
 const regions={
  foreheadLeft:[[50,77],[94,72],[121,94],[119,123],[98,140],[66,133],[52,112]],
  foreheadRight:[[145,70],[210,68],[229,101],[219,133],[190,145],[158,116]],
  blackEye:[[43,111],[111,108],[142,125],[142,166],[119,187],[68,185],[43,160]],
  cheek:[[150,151],[218,149],[235,191],[213,225],[180,231],[158,206]],
  noseMouth:[[105,168],[166,169],[185,226],[177,286],[142,305],[111,276],[96,221]]
 };
 function polygonMask(poly){const c=document.createElement('canvas');c.width=260;c.height=320;const x=c.getContext('2d');x.fillStyle='#fff';x.beginPath();poly.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fill();return x.getImageData(0,0,260,320).data;}
 function buildDamageLayers(){
  const d=document.createElement('canvas');d.width=260;d.height=320;const dx=d.getContext('2d',{willReadFrequently:true});dx.imageSmoothingEnabled=false;dx.drawImage(damaged,0,0,260,320);
  const pixels=dx.getImageData(0,0,260,320).data;
  const specs=[
   [['foreheadLeft','foreheadRight'],'redPurple'],
   [['blackEye'],'darkPurple'],
   [['cheek','noseMouth'],'mixed']
  ];
  const masks={};Object.keys(regions).forEach(k=>masks[k]=polygonMask(regions[k]));
  specs.forEach((spec,i)=>{const layer=ctx.createImageData(260,320);
   for(let p=0;p<pixels.length;p+=4){
    let inside=false;for(const name of spec[0])if(masks[name][p+3]>0){inside=true;break;}if(!inside||pixels[p+3]<10)continue;
    const r=pixels[p],g=pixels[p+1],b=pixels[p+2];
    const red=r>90&&r>g+24&&r>b+8;
    const purple=r>g+10&&b>g+7&&r<190&&g<145&&b<190;
    const darkPurple=r<110&&b>g+2&&r>g-12;
    const selected=spec[1]==='red'?red:spec[1]==='darkPurple'?(purple||darkPurple):spec[1]==='mixed'?(masks.noseMouth[p+3]>0?red:(red||purple)):(red||purple);
    if(selected){layer.data[p]=r;layer.data[p+1]=g;layer.data[p+2]=b;layer.data[p+3]=Math.min(235,pixels[p+3]);}
   }
   damageLayers.push(layer);
  });
 }
 function renderFace(){
  if(!ready)return;ctx.clearRect(0,0,260,320);ctx.imageSmoothingEnabled=false;ctx.drawImage(clean,0,0,260,320);
  const level=Math.min(4,Math.floor((slaps-1)/3)+1);
  if(slaps>0&&level<4){for(let i=0;i<level;i++){const layer=damageLayers[i];if(!layer)continue;const temp=document.createElement('canvas');temp.width=260;temp.height=320;temp.getContext('2d').putImageData(layer,0,0);ctx.drawImage(temp,0,0);}}
  else if(level>=4)ctx.drawImage(damaged,0,0,260,320);
 }
 const lines=['A cheeky little tap!','Oof! That left a mark.','The pixel bruises are showing.','That one left a scratch!','He might need a pixel ice pack.','Full-on 16-bit slapstick!','Somebody find this lad a cushion.'];
 const levels=['Fresh','Rosy','Bruised','Battered','Rough','Legendary'];
 function slap(){slaps++;face.classList.remove('hit');void face.offsetWidth;face.classList.add('hit');setTimeout(()=>face.classList.remove('hit'),240);scoreEl.textContent=slaps;const n=Math.min(4,Math.floor((slaps-1)/3)+1);levelEl.textContent=levels[Math.min(levels.length-1,Math.floor(slaps/2))];fill.style.width=Math.min(100,slaps/12*100)+'%';message.textContent=slaps%3===0?lines[Math.min(lines.length-1,Math.floor(slaps/3))]:['Well, that was rude.','Another pixel-perfect slap!','The face is not impressed.'][slaps%3];renderFace();const s=document.createElement('span');s.className='spark';s.textContent=['💥','✋','POW!','SMACK!'][Math.floor(Math.random()*4)];s.style.left=(28+Math.random()*44)+'%';s.style.top=(20+Math.random()*35)+'%';s.style.setProperty('--dx',(Math.random()*100-50)+'px');stage.appendChild(s);setTimeout(()=>s.remove(),600);if(n===4&&slaps%3===0)message.textContent='Maximum cartoon damage! Reset for another round.'}
 function reset(){slaps=0;scoreEl.textContent='0';levelEl.textContent='Fresh';fill.style.width='0%';message.textContent="He's feeling pretty confident...";stage.querySelectorAll('.spark').forEach(x=>x.remove());renderFace();}
 face.addEventListener('click',slap);face.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();slap();}});document.getElementById('slapBtn').addEventListener('click',slap);document.getElementById('resetBtn').addEventListener('click',reset);
})();
</script>
</body></html>
